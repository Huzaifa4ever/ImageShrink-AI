<!-- Activity-bar icon. Monochrome by design: VS Code masks it to the theme's foreground
     colour, so any colour here would be discarded. Three bars narrowing downward read as
     "shrinking" at 24px, where a container or whale silhouette turns to mush. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="4" width="18" height="3.2" rx="1.3" fill="#C5C5C5"/>
  <rect x="6" y="10.4" width="12" height="3.2" rx="1.3" fill="#C5C5C5"/>
  <rect x="9" y="16.8" width="6" height="3.2" rx="1.3" fill="#C5C5C5"/>
</svg>
